<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, minimum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#7a1f35">
<meta name="robots" content="noindex">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="깽&amp;테리 시음회">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="format-detection" content="telephone=no">
<title>깽이와 테리의 시음회 노트</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=IBM+Plex+Sans+KR:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Layout: 폰 한 손 조작 — 상단 고정 검색/필터, 카드에서 바로 체크·별점·메모, 산지를 누르면 해설이 펼쳐짐 */
:root{
  --bg:#f6f3f1; --surface:#ffffff; --fg:#231c1e; --muted:#6f6467; --line:#e6dddd; --soft:#f1ebe9;
  --accent:#7a1f35; --accent-fg:#ffffff; --accent-soft:#f5e6ea;
  --red:#8c2236; --white:#9a7b14; --spark:#2f6f82; --rose:#c04f6d; --sweet:#9a5a1c; --orange:#b8691d;
  --star:#b8860b; --done:#2f7a4f; --done-soft:#e3f1e8; --day:#5a3fa0; --day-soft:#ece6f8;
  --geo:#355e3b; --geo-soft:#e8f0e6;
  --f-display:"Gowun Batang","Nanum Myeongjo",Georgia,serif;
  --f-body:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Consolas,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){:root{
  --bg:#161113; --surface:#211a1c; --fg:#efe7e8; --muted:#a8999c; --line:#392e31; --soft:#2a2124;
  --accent:#e0849a; --accent-fg:#1a1013; --accent-soft:#3a2229;
  --red:#e07a8c; --white:#d9bd5c; --spark:#7fbfd1; --rose:#ee9bb1; --sweet:#d89a5a; --orange:#e9a35e;
  --star:#e3b641; --done:#6fcf97; --done-soft:#1f3328; --day:#b9a3f0; --day-soft:#2b2340;
  --geo:#9fd3a4; --geo-soft:#1f2e22; color-scheme:dark}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%;touch-action:manipulation}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:16px;line-height:1.55;overscroll-behavior-y:none}
button{font:inherit;color:inherit;touch-action:manipulation}
.wrap{max-width:720px;margin:0 auto;padding-left:max(14px,env(safe-area-inset-left));padding-right:max(14px,env(safe-area-inset-right))}

header.intro{padding-top:calc(18px + env(safe-area-inset-top));padding-bottom:10px}
h1{font-family:var(--f-display);font-size:24px;line-height:1.25;margin:0}
.progress{margin-top:10px;display:flex;align-items:center;gap:10px;font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.bar{flex:1;height:6px;background:var(--line);border-radius:3px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--done);width:0;transition:width .3s}
.legend{font-size:12px;color:var(--muted);margin:8px 0 0}

.controls{position:sticky;top:0;z-index:10;background:var(--bg);padding-top:calc(8px + env(safe-area-inset-top));padding-bottom:8px;border-bottom:1px solid var(--line);box-shadow:0 6px 12px -10px rgba(0,0,0,.25)}
.search{display:flex;gap:6px}
.search input{flex:1;min-width:0;font:inherit;font-size:16px;border:1px solid var(--line);background:var(--surface);color:var(--fg);border-radius:12px;padding:10px 12px;-webkit-appearance:none;appearance:none}
.search select{font:inherit;font-size:16px;border:1px solid var(--line);background:var(--surface);color:var(--fg);border-radius:12px;padding:0 6px;max-width:30%}
.icon-btn{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:0 12px;font-size:14px;position:relative;cursor:pointer}
.icon-btn[aria-expanded="true"]{border-color:var(--accent);color:var(--accent)}
.icon-btn .dot{position:absolute;top:-5px;right:-5px;min-width:18px;height:18px;border-radius:9px;background:var(--accent);color:var(--accent-fg);font-size:11px;line-height:18px;text-align:center;padding:0 4px}
.scroller{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin:8px calc(-1 * max(14px,env(safe-area-inset-left))) 0;padding:0 max(14px,env(safe-area-inset-left)) 2px;-webkit-overflow-scrolling:touch}
.scroller::-webkit-scrollbar{display:none}
.chip{flex:none;font-size:14px;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 13px;cursor:pointer;white-space:nowrap;font-variant-numeric:tabular-nums}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.panel-lbl{font-size:11.5px;color:var(--muted);margin:10px 0 -2px;letter-spacing:.04em}
.active-row{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.active-row:empty{display:none}
.pill-x{font-size:13px;border:0;background:var(--geo-soft);color:var(--geo);border-radius:999px;padding:5px 10px;cursor:pointer}
.count{font-size:12.5px;color:var(--muted);margin-top:6px}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

main{padding-bottom:calc(96px + env(safe-area-inset-bottom))}
.group-h{font-family:var(--f-display);font-size:20px;margin:22px 2px 8px;display:flex;align-items:baseline;gap:8px}
.group-h small{font-family:var(--f-body);font-size:12.5px;color:var(--muted);font-weight:400}
.list{display:flex;flex-direction:column;gap:12px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px 14px 12px;min-width:0}
.card.done{border-color:var(--done);box-shadow:inset 4px 0 0 var(--done)}
.top{display:flex;gap:10px;align-items:flex-start}
.top .h{flex:1;min-width:0}
.name{font-weight:600;font-size:16.5px;line-height:1.4;word-break:keep-all;overflow-wrap:anywhere}
.producer{font-size:13px;color:var(--muted);margin-top:1px}
.viv{flex:none;text-align:right;line-height:1.1}
.viv b{display:block;font-family:var(--f-mono);font-size:20px;color:var(--star)}
.viv small{font-size:10.5px;color:var(--muted)}
.meta{display:flex;flex-wrap:wrap;gap:5px 8px;align-items:center;margin-top:8px;font-size:13px;color:var(--muted)}
.tag{font-size:12px;font-weight:600;border-radius:5px;padding:1px 6px;border:1px solid currentColor;white-space:nowrap}
.t-R{color:var(--red)}.t-W{color:var(--white)}.t-S{color:var(--spark)}.t-P{color:var(--rose)}.t-D{color:var(--sweet)}.t-O{color:var(--orange)}
.tag.day{color:var(--day);background:var(--day-soft);border-color:transparent}
.price{font-family:var(--f-mono);color:var(--fg)}
.region-btn{display:inline-flex;align-items:center;gap:4px;margin-top:8px;border:1px solid transparent;background:var(--geo-soft);color:var(--geo);border-radius:10px;padding:6px 10px;font-size:14px;font-weight:500;cursor:pointer;max-width:100%;text-align:left}
.region-btn .chev{transition:transform .2s;font-size:11px}
.region-btn[aria-expanded="true"] .chev{transform:rotate(180deg)}
.region-btn:disabled{background:none;padding-left:0;color:var(--muted);cursor:default}
.region{margin-top:8px;background:var(--geo-soft);border-radius:12px;padding:12px;font-size:14.5px;display:grid;gap:8px}
.region dl{margin:0;display:grid;gap:8px}
.region dt{font-size:11.5px;font-weight:600;color:var(--geo);letter-spacing:.04em}
.region dd{margin:1px 0 0}
.region .more{justify-self:start;border:1px solid var(--geo);background:transparent;color:var(--geo);border-radius:999px;padding:5px 12px;font-size:13px;cursor:pointer}
details{margin-top:8px}
summary{font-size:14px;color:var(--accent);cursor:pointer;list-style:none;padding:4px 0}
summary::-webkit-details-marker{display:none}
summary::before{content:"▸ "}
details[open] summary::before{content:"▾ "}
.info{font-size:14.5px;margin-top:4px;display:grid;gap:8px}
.info p{margin:0}
.lbl{font-size:11.5px;color:var(--muted);display:block}
.info .rev{font-family:var(--f-display)}
.info a{color:var(--accent);font-size:13.5px}

.mine{margin-top:12px;padding-top:12px;border-top:1px dashed var(--line);display:grid;gap:10px}
.acts{display:grid;grid-template-columns:1.3fr .8fr 1fr;gap:8px}
.btn{font-size:15px;border:1px solid var(--line);background:var(--soft);border-radius:12px;padding:10px 8px;cursor:pointer;min-height:44px;white-space:nowrap}
.btn.check[aria-pressed="true"]{background:var(--done-soft);border-color:var(--done);color:var(--done);font-weight:600}
.btn.wish[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent);color:var(--accent);font-weight:600}
.btn.pick[aria-pressed="true"]{background:var(--day-soft);border-color:var(--day);color:var(--day);font-weight:600}
.rate{display:flex;align-items:center;justify-content:space-between}
.rate .lbl{font-size:13px}
.stars{display:flex}
.stars button{font-size:28px;line-height:1;background:none;border:0;padding:4px 3px;color:var(--line);cursor:pointer;min-width:42px;min-height:44px}
.stars button.on{color:var(--star)}
textarea{font:inherit;font-size:16px;width:100%;min-height:46px;resize:none;border:1px solid var(--line);background:var(--soft);color:var(--fg);border-radius:12px;padding:10px 12px;overflow:hidden}
.memo-row{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:end}
.btn.save{min-width:72px;font-weight:600}
.btn.save:not(:disabled){background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.btn.save:disabled{color:var(--muted);cursor:default}
.empty{color:var(--muted);padding:30px 4px;text-align:center}

.dock{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);padding:10px max(14px,env(safe-area-inset-right)) calc(10px + env(safe-area-inset-bottom)) max(14px,env(safe-area-inset-left))}
.dock .wrap{display:grid;grid-template-columns:1fr 2fr;gap:8px;padding:0}
.dock .btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-fg);font-weight:600}
.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:8px 14px;border-radius:10px;font-size:14px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:30;max-width:90vw;text-align:center}
.toast.show{opacity:1}
dialog{border:1px solid var(--line);border-radius:16px;background:var(--surface);color:var(--fg);width:min(92vw,560px);padding:16px}
dialog::backdrop{background:rgba(0,0,0,.45)}
dialog h2{font-family:var(--f-display);font-size:19px;margin:0 0 6px}
dialog p{margin:0 0 8px;font-size:13px;color:var(--muted)}
dialog textarea{min-height:40vh;font-size:14px;overflow:auto}
dialog .row{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<header class="intro wrap">
  <h1>깽이와 테리의 시음회 노트</h1>
  <div class="progress"><div class="bar"><i id="bar"></i></div><span id="prog">0 / 132 시음</span></div>
  <p class="legend">‘≈’ 표시는 정확히 같은 퀴베를 찾지 못해 가장 가까운 항목으로 대신한 경우이고, ‘—’는 Vivino에 등록되지 않았거나 평가가 부족한 경우입니다.</p>
</header>

<div class="controls">
  <div class="wrap">
    <div class="search">
      <input type="search" id="q" placeholder="와인·생산자·산지·메모 검색" aria-label="검색" autocomplete="off" enterkeyhint="search">
      <select id="sort" aria-label="정렬">
        <option value="list">출품순</option>
        <option value="rating">Vivino순</option>
        <option value="mine">내 별점순</option>
        <option value="price">가격순</option>
      </select>
      <button type="button" class="icon-btn" id="filter-btn" aria-expanded="false" aria-controls="filter-panel">필터</button>
    </div>
    <div class="scroller" id="status"></div>
    <div id="filter-panel" hidden>
      <div class="panel-lbl">유형</div>
      <div class="scroller" id="types"></div>
      <div class="panel-lbl">수입사</div>
      <div class="scroller" id="importers"></div>
    </div>
    <div class="active-row" id="active"></div>
    <div class="count" id="count"></div>
  </div>
</div>

<main class="wrap" id="out"></main>

<div class="dock"><div class="wrap">
  <button class="btn" id="top-btn" type="button">맨 위로</button>
  <button class="btn primary" id="share-btn" type="button">내 노트 공유하기</button>
</div></div>

<dialog id="dlg">
  <h2>내 시음 노트</h2>
  <p>복사해서 카톡 등에 붙여넣으면 같이 볼 수 있어요.</p>
  <textarea id="dlg-text" readonly aria-label="내 시음 노트 텍스트"></textarea>
  <div class="row"><button class="btn" type="button" id="dlg-close">닫기</button><button class="btn primary" type="button" id="dlg-copy">복사</button></div>
</dialog>
<div class="toast" id="toast" role="status"></div>

<script src="data.js"></script>
<script src="regions.js"></script>
<script>
// 확대/축소 막기: iOS Safari는 viewport 설정을 무시하므로 핀치·더블탭 제스처를 직접 막는다
["gesturestart","gesturechange","gestureend"].forEach(t=>document.addEventListener(t,e=>e.preventDefault(),{passive:false}));
document.addEventListener("touchmove",e=>{if(e.touches.length>1)e.preventDefault()},{passive:false});
let lastTouch=0;
document.addEventListener("touchend",e=>{const now=Date.now();if(now-lastTouch<300&&!e.target.closest("input,textarea,select"))e.preventDefault();lastTouch=now},{passive:false});

const TYPES={R:"레드",W:"화이트",S:"스파클링",P:"로제",D:"디저트·주정강화",O:"오렌지·내추럴"};
const norm=s=>String(s).normalize("NFD").replace(/[̀-ͯ]/g,"").toLowerCase().replace(/[-'’.,·()\[\]]/g," ");
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const won=p=>p?`${p[0]}~${p[1]}만원`:"";

W.forEach((w,i)=>{
  w.idx=i; w.tags=[];
  w.name=w[1].replace(/\((토요일|일요일)\)/,(m,d)=>{w.tags.push(d+"만");return""})
             .replace(/\((비탈와인[^)]*)\)/,()=>{w.tags.push("구매 한정 · 하루 1병");return""}).trim();
  w.key=w[0]+"|"+w[1];
  w.producer=META[i][0]; w.reg=META[i][1];
  w.grape=(w[4]||"").split(" · ")[1]||"";
  const r=REG[w.reg];
  w.hay=norm([w[0],w[1],w[3],w[4],w[8],EN[w[1]]||"",w.producer,r?r.name+" "+r.country:""].join(" "));
});

const STORE="wine-tasting-2026-10";
let my={};
try{my=JSON.parse(localStorage.getItem(STORE)||"{}")||{}}catch(e){my={}}
const save=()=>{try{localStorage.setItem(STORE,JSON.stringify(my))}catch(e){}};
const get=k=>my[k]||(my[k]={});

let prefs={status:"all",type:"all",imp:"all",sort:"list",reg:""};
try{Object.assign(prefs,JSON.parse(sessionStorage.getItem(STORE+"-ui")||"{}"))}catch(e){}
const savePrefs=()=>{try{sessionStorage.setItem(STORE+"-ui",JSON.stringify(prefs))}catch(e){}};
let q="";
const openReg=new Set();

const imps=[...new Set(W.map(w=>w[0]))];
function chips(el,items,key){
  el.innerHTML=items.map(([v,l])=>`<button type="button" class="chip" data-v="${esc(v)}">${esc(l)}</button>`).join("");
  el.onclick=e=>{const b=e.target.closest(".chip");if(!b)return;prefs[key]=b.dataset.v;paintChips();savePrefs();render()};
}
function paintChips(){
  [["#status","status"],["#types","type"],["#importers","imp"]].forEach(([s,k])=>document.querySelectorAll(s+" .chip").forEach(c=>c.setAttribute("aria-pressed",c.dataset.v===prefs[k])));
  const n=(prefs.type!=="all")+(prefs.imp!=="all");
  $("#filter-btn").innerHTML="필터"+(n?`<span class="dot">${n}</span>`:"");
  const act=[];
  if(prefs.reg&&REG[prefs.reg])act.push(`<button type="button" class="pill-x" data-clear="reg">산지: ${esc(REG[prefs.reg].name)} ✕</button>`);
  if(prefs.type!=="all")act.push(`<button type="button" class="pill-x" data-clear="type">${esc(TYPES[prefs.type])} ✕</button>`);
  if(prefs.imp!=="all")act.push(`<button type="button" class="pill-x" data-clear="imp">${esc(prefs.imp)} ✕</button>`);
  $("#active").innerHTML=act.join("");
}
chips($("#status"),[["all","전체"],["wish","♥ 하트"],["pick","찜"],["todo","아직 안 마심"],["done","마신 것"],["sat","토요일만"],["sun","일요일만"]],"status");
chips($("#types"),[["all","모든 유형"],...Object.entries(TYPES)],"type");
chips($("#importers"),[["all","모든 수입사"],...imps.map(i=>[i,i])],"imp");
$("#sort").value=prefs.sort;
$("#active").onclick=e=>{const b=e.target.closest("[data-clear]");if(!b)return;const k=b.dataset.clear;prefs[k]=k==="reg"?"":"all";paintChips();savePrefs();render()};
$("#filter-btn").onclick=()=>{const p=$("#filter-panel"),open=p.hidden;p.hidden=!open;$("#filter-btn").setAttribute("aria-expanded",open)};

function regionPanel(w){
  const r=REG[w.reg];if(!r)return"";
  const same=W.filter(x=>x.reg===w.reg).length;
  return `<div class="region" id="reg-${w.idx}"><dl>
    <div><dt>어디쯤</dt><dd>${esc(r.loc)}</dd></div>
    <div><dt>기후 · 기온</dt><dd>${esc(r.clim)}</dd></div>
    <div><dt>토양 · 지형</dt><dd>${esc(r.soil)}</dd></div>
    <div><dt>맛에 주는 영향</dt><dd>${esc(r.taste)}</dd></div></dl>
    ${same>1?`<button type="button" class="more" data-act="samereg">이 산지 와인 ${same}종 모아보기</button>`:""}
  </div>`;
}
// 메모는 저장 버튼을 눌러야 확정된다. 쓰던 글(draft)은 따로 보관해 페이지를 나가도 사라지지 않는다
const dirty=m=>m.draft!=null&&m.draft!==(m.memo||"");
function saveBtn(m){
  const d=dirty(m);
  return `<button type="button" class="btn save" data-act="save" ${d?"":"disabled"}>${d?"저장":(m.memo?"✓ 저장됨":"저장")}</button>`;
}
function card(w){
  const m=my[w.key]||{};
  const [,,t,vname,,r,c,id,note,rev,price]=w;
  const approx=vname.startsWith("≈")?"≈":"";
  const viv=r?`<b>${approx}${r.toFixed(1)}</b><small>Vivino ${c.toLocaleString()}</small>`:`<b>—</b><small>Vivino</small>`;
  const tags=w.tags.map(x=>`<span class="tag day">${esc(x)}</span>`).join("");
  const reg=REG[w.reg], open=openReg.has(w.idx);
  const regBtn=reg?`<button type="button" class="region-btn" data-act="region" aria-expanded="${open}" aria-controls="reg-${w.idx}">${esc(reg.name)} · ${esc(reg.country)} <span class="chev">▾</span></button>`:"";
  const hasNote=note&&!note.startsWith("Vivino");
  const info=(hasNote||id)?`<details><summary>노트 · 후기 보기</summary><div class="info">
      ${hasNote?`<p><span class="lbl">테이스팅 노트</span>${esc(note)}</p>`:""}
      ${rev&&rev!=="—"?`<p class="rev"><span class="lbl">Vivino 대표 후기</span>${esc(rev)}</p>`:""}
      ${id?`<a href="https://www.vivino.com/w/${id}" target="_blank" rel="noopener">Vivino에서 보기 · ${esc(vname.replace(/^≈ /,""))}</a>`:""}
    </div></details>`:"";
  const stars=[1,2,3,4,5].map(n=>`<button type="button" data-act="star" data-n="${n}" class="${(m.stars||0)>=n?"on":""}" aria-label="내 별점 ${n}점">★</button>`).join("");
  return `<article class="card${m.done?" done":""}" data-i="${w.idx}">
    <div class="top"><div class="h"><div class="name">${esc(w.name)}</div>${w.producer?`<div class="producer">${esc(w.producer)}</div>`:""}</div><div class="viv">${viv}</div></div>
    <div class="meta"><span class="tag t-${t}">${TYPES[t]}</span>${tags}${w.grape?`<span>${esc(w.grape)}</span>`:""}${price?`<span class="price">${won(price)}</span>`:""}</div>
    ${regBtn}${open?regionPanel(w):""}
    ${info}
    <div class="mine">
      <div class="acts">
        <button type="button" class="btn check" data-act="done" aria-pressed="${!!m.done}">${m.done?"✓ 마셨어요":"마셨어요"}</button>
        <button type="button" class="btn wish" data-act="wish" aria-pressed="${!!m.wish}" aria-label="하트">${m.wish?"♥ 하트":"♡ 하트"}</button>
        <button type="button" class="btn pick" data-act="pick" aria-pressed="${!!m.pick}">${m.pick?"✓ 찜":"찜하기"}</button>
      </div>
      <div class="rate"><span class="lbl">내 별점</span><div class="stars" role="group" aria-label="내 별점">${stars}</div></div>
      <div class="memo-row">
        <textarea data-act="memo" rows="1" placeholder="내 메모 (향, 맛, 페어링…)" aria-label="${esc(w.name)} 메모">${esc(m.draft??m.memo??"")}</textarea>
        ${saveBtn(m)}
      </div>
    </div>
  </article>`;
}

function matches(w){
  const m=my[w.key]||{},s=prefs.status;
  if(s==="todo"&&m.done)return false;
  if(s==="done"&&!m.done)return false;
  if(s==="wish"&&!m.wish)return false;
  if(s==="pick"&&!m.pick)return false;
  if(s==="sat"&&!w.tags.includes("토요일만"))return false;
  if(s==="sun"&&!w.tags.includes("일요일만"))return false;
  if(prefs.type!=="all"&&w[2]!==prefs.type)return false;
  if(prefs.imp!=="all"&&w[0]!==prefs.imp)return false;
  if(prefs.reg&&w.reg!==prefs.reg)return false;
  if(q){const hay=w.hay+" "+norm(m.memo||"");if(!q.split(/\s+/).every(t=>hay.includes(t)))return false}
  return true;
}
function render(){
  const rows=W.filter(matches);
  $("#count").textContent=`${rows.length}종 표시 중`;
  const out=$("#out");
  if(!rows.length){out.innerHTML='<p class="empty">조건에 맞는 와인이 없어요. 검색어나 필터를 바꿔 보세요.</p>';progress();return}
  if(prefs.sort==="list"){
    out.innerHTML=imps.map(i=>{const g=rows.filter(w=>w[0]===i);return g.length?`<h2 class="group-h">${esc(i)}<small>${g.length}종</small></h2><div class="list">${g.map(card).join("")}</div>`:""}).join("");
  }else{
    const by={rating:(a,b)=>(b[5]||0)-(a[5]||0),
      mine:(a,b)=>((my[b.key]||{}).stars||0)-((my[a.key]||{}).stars||0)||(b[5]||0)-(a[5]||0),
      price:(a,b)=>(a[10]?a[10][0]:999)-(b[10]?b[10][0]:999)}[prefs.sort];
    out.innerHTML=`<div class="list" style="margin-top:14px">${[...rows].sort(by).map(card).join("")}</div>`;
  }
  out.querySelectorAll("textarea").forEach(grow);
  progress();
}
function progress(){
  const cnt=k=>W.filter(w=>(my[w.key]||{})[k]).length;
  const n=cnt("done");
  $("#prog").textContent=`${n} / ${W.length} 시음`;
  $("#bar").style.width=(n/W.length*100)+"%";
  $('#status .chip[data-v="done"]').textContent=`마신 것 ${n}`;
  $('#status .chip[data-v="wish"]').textContent=`♥ 하트 ${cnt("wish")}`;
  $('#status .chip[data-v="pick"]').textContent=`찜 ${cnt("pick")}`;
}
function grow(t){t.style.height="auto";t.style.height=t.scrollHeight+2+"px"}
function refreshCard(cardEl,w){
  const tmp=document.createElement("div");tmp.innerHTML=card(w);
  const nc=tmp.firstElementChild;cardEl.replaceWith(nc);nc.querySelectorAll("textarea").forEach(grow);
  return nc;
}

// 카드 안 조작은 해당 카드만 다시 그려 스크롤 위치를 지킨다
$("#out").addEventListener("click",e=>{
  const b=e.target.closest("[data-act]");if(!b||b.tagName==="TEXTAREA")return;
  const cardEl=b.closest(".card"),w=W[+cardEl.dataset.i],act=b.dataset.act;
  if(act==="region"){openReg.has(w.idx)?openReg.delete(w.idx):openReg.add(w.idx);refreshCard(cardEl,w);return}
  if(act==="samereg"){prefs.reg=w.reg;prefs.status="all";paintChips();savePrefs();render();window.scrollTo({top:$("#out").offsetTop-160});return}
  const m=get(w.key);
  if(act==="save"){
    if(!dirty(m))return;
    m.memo=m.draft.trim();delete m.draft;save();
    const box=b.parentNode,tmp=document.createElement("div");tmp.innerHTML=saveBtn(m);box.replaceChild(tmp.firstElementChild,b);
    box.querySelector("textarea").value=m.memo;
    toast("메모 저장 완료");return;
  }
  if(act==="done")m.done=!m.done;
  if(act==="wish")m.wish=!m.wish;
  if(act==="pick")m.pick=!m.pick;
  if(act==="star"){const n=+b.dataset.n;m.stars=m.stars===n?0:n;if(m.stars)m.done=true}
  save();refreshCard(cardEl,w);progress();
});
$("#out").addEventListener("input",e=>{
  const t=e.target;if(t.dataset.act!=="memo")return;
  const m=get(W[+t.closest(".card").dataset.i].key);
  if(t.value===(m.memo||""))delete m.draft;else m.draft=t.value;
  save();grow(t);
  const old=t.parentNode.querySelector(".save"),tmp=document.createElement("div");tmp.innerHTML=saveBtn(m);old.replaceWith(tmp.firstElementChild);
});

let timer;$("#q").addEventListener("input",e=>{clearTimeout(timer);timer=setTimeout(()=>{q=norm(e.target.value).trim();render()},120)});
$("#q").addEventListener("keydown",e=>{if(e.key==="Enter")e.target.blur()});
$("#sort").onchange=e=>{prefs.sort=e.target.value;savePrefs();render()};
$("#top-btn").onclick=()=>window.scrollTo({top:0,behavior:"smooth"});

function toast(s){const t=$("#toast");t.textContent=s;t.classList.add("show");setTimeout(()=>t.classList.remove("show"),1800)}
function exportText(){
  const rec=W.filter(w=>{const m=my[w.key]||{};return m.done||m.stars||m.memo||m.wish||m.pick});
  if(!rec.length)return "";
  const lines=["🍷 깽이와 테리의 시음회 노트",""];
  imps.forEach(i=>{
    const g=rec.filter(w=>w[0]===i);if(!g.length)return;
    lines.push(`[${i}]`);
    g.forEach(w=>{const m=my[w.key];lines.push(`· ${m.wish?"♥ ":""}${m.pick?"[찜] ":""}${w.name}${m.stars?" "+"★".repeat(m.stars)+"☆".repeat(5-m.stars):""}${w[5]?` (Vivino ${w[5].toFixed(1)})`:""}`);if(m.memo)lines.push(`  ${m.memo.replace(/\n/g," ")}`)});
    lines.push("");
  });
  return lines.join("\n").trim();
}
$("#share-btn").onclick=async()=>{
  const txt=exportText();
  if(!txt){toast("아직 기록한 와인이 없어요");return}
  if(navigator.share){try{await navigator.share({title:"깽이와 테리의 시음회 노트",text:txt});return}catch(e){if(e.name==="AbortError")return}}
  $("#dlg-text").value=txt;$("#dlg").showModal();
};
$("#dlg-close").onclick=()=>$("#dlg").close();
$("#dlg-copy").onclick=async()=>{
  const t=$("#dlg-text");
  try{await navigator.clipboard.writeText(t.value);toast("복사했어요")}
  catch(e){t.select();toast("선택했어요. 길게 눌러 복사하세요")}
};

paintChips();render();
if("serviceWorker" in navigator)window.addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}));
</script>
</body>
</html>
