<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#7a1f35">
<meta name="robots" content="noindex">
<title>깽이와 테리의 시음회 노트</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=IBM+Plex+Sans+KR:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Layout: 폰 한 손 조작 — 상단 고정 검색/필터, 아래로 와인 카드, 카드 안에서 바로 체크·별점·메모 */
:root{
  --bg:#f7f5f3; --surface:#ffffff; --fg:#231c1e; --muted:#6f6467; --line:#e4dcdc;
  --accent:#7a1f35; --accent-fg:#ffffff; --accent-soft:#f5e6ea;
  --red:#8c2236; --white:#9a7b14; --spark:#2f6f82; --rose:#c04f6d; --sweet:#9a5a1c; --orange:#b8691d;
  --star:#b8860b; --done:#2f7a4f; --done-soft:#e3f1e8; --day:#5a3fa0; --day-soft:#ece6f8;
  --f-display:"Gowun Batang","Nanum Myeongjo",Georgia,serif;
  --f-body:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Consolas,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){:root{
  --bg:#171214; --surface:#211a1c; --fg:#efe7e8; --muted:#a8999c; --line:#3a2f32;
  --accent:#e0849a; --accent-fg:#1a1013; --accent-soft:#3a2229;
  --red:#e07a8c; --white:#d9bd5c; --spark:#7fbfd1; --rose:#ee9bb1; --sweet:#d89a5a; --orange:#e9a35e;
  --star:#e3b641; --done:#6fcf97; --done-soft:#1f3328; --day:#b9a3f0; --day-soft:#2b2340; color-scheme:dark}}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:16px;line-height:1.55}
.wrap{max-width:760px;margin:0 auto;padding-left:max(14px,env(safe-area-inset-left));padding-right:max(14px,env(safe-area-inset-right))}
header.intro{padding-top:calc(20px + env(safe-area-inset-top));padding-bottom:6px}
h1{font-family:var(--f-display);font-size:26px;line-height:1.25;margin:0;text-wrap:balance}
.lede{color:var(--muted);font-size:13.5px;margin:6px 0 0}
.progress{margin-top:12px;display:flex;align-items:center;gap:10px;font-size:13px;color:var(--muted)}
.bar{flex:1;height:6px;background:var(--line);border-radius:3px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--done);width:0;transition:width .3s}

.controls{position:sticky;top:0;z-index:10;background:var(--bg);padding-top:calc(8px + env(safe-area-inset-top));padding-bottom:8px;border-bottom:1px solid var(--line)}
.search{display:flex;gap:8px}
.search input{flex:1;min-width:0;font:inherit;font-size:16px;border:1px solid var(--line);background:var(--surface);color:var(--fg);border-radius:12px;padding:10px 12px}
.search select{font:inherit;font-size:14px;border:1px solid var(--line);background:var(--surface);color:var(--fg);border-radius:12px;padding:0 8px}
.scroller{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin-top:8px;padding-bottom:2px;-webkit-overflow-scrolling:touch}
.scroller::-webkit-scrollbar{display:none}
.chip{flex:none;font:inherit;font-size:13.5px;border:1px solid var(--line);background:var(--surface);color:var(--fg);border-radius:999px;padding:6px 12px;cursor:pointer;white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.count{font-size:12.5px;color:var(--muted);margin-top:6px}

main{padding-bottom:calc(90px + env(safe-area-inset-bottom))}
.group-h{font-family:var(--f-display);font-size:20px;margin:22px 2px 8px;display:flex;align-items:baseline;gap:8px}
.group-h small{font-family:var(--f-body);font-size:12.5px;color:var(--muted);font-weight:400}
.list{display:flex;flex-direction:column;gap:10px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;min-width:0}
.card.done{border-color:var(--done);box-shadow:inset 4px 0 0 var(--done)}
.top{display:flex;gap:10px;align-items:flex-start}
.top .name{flex:1;min-width:0;font-weight:600;font-size:16px;line-height:1.4;word-break:keep-all;overflow-wrap:anywhere}
.viv{flex:none;text-align:right;line-height:1.1}
.viv b{display:block;font-family:var(--f-mono);font-size:20px;color:var(--star)}
.viv small{font-size:10.5px;color:var(--muted)}
.meta{display:flex;flex-wrap:wrap;gap:4px 8px;align-items:center;margin-top:6px;font-size:12.5px;color:var(--muted)}
.tag{font-size:11.5px;font-weight:600;border-radius:5px;padding:1px 6px;border:1px solid currentColor;white-space:nowrap}
.t-R{color:var(--red)}.t-W{color:var(--white)}.t-S{color:var(--spark)}.t-P{color:var(--rose)}.t-D{color:var(--sweet)}.t-O{color:var(--orange)}
.tag.day{color:var(--day);background:var(--day-soft);border-color:transparent}
.price{font-family:var(--f-mono);color:var(--fg)}
details{margin-top:8px}
summary{font-size:13px;color:var(--accent);cursor:pointer;list-style:none;padding:2px 0}
summary::-webkit-details-marker{display:none}
summary::before{content:"▸ ";}
details[open] summary::before{content:"▾ "}
.info{font-size:14px;margin-top:6px;display:grid;gap:6px}
.info p{margin:0}
.info .lbl{font-size:11.5px;color:var(--muted);display:block}
.info .rev{font-family:var(--f-display)}
.info a{color:var(--accent);font-size:13px}

.mine{margin-top:10px;padding-top:10px;border-top:1px dashed var(--line);display:flex;flex-direction:column;gap:8px}
.mine-row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.btn{font:inherit;font-size:14px;border:1px solid var(--line);background:var(--bg);color:var(--fg);border-radius:10px;padding:8px 12px;cursor:pointer;min-height:40px}
.btn.check[aria-pressed="true"]{background:var(--done-soft);border-color:var(--done);color:var(--done);font-weight:600}
.btn.wish[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent);color:var(--accent);font-weight:600}
.stars{display:flex;margin-left:auto}
.stars button{font-size:26px;line-height:1;background:none;border:0;padding:4px 3px;color:var(--line);cursor:pointer;min-width:36px;min-height:40px}
.stars button.on{color:var(--star)}
textarea{font:inherit;font-size:15px;width:100%;min-height:44px;resize:vertical;border:1px solid var(--line);background:var(--bg);color:var(--fg);border-radius:10px;padding:8px 10px}
.empty{color:var(--muted);padding:30px 4px;text-align:center}

.dock{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);padding:10px max(14px,env(safe-area-inset-right)) calc(10px + env(safe-area-inset-bottom)) max(14px,env(safe-area-inset-left))}
.dock .wrap{display:flex;gap:8px;padding:0}
.dock .btn{flex:1}
.dock .btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-fg);font-weight:600}
.toast{position:fixed;left:50%;bottom:calc(80px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:8px 14px;border-radius:10px;font-size:14px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:30;max-width:90vw;text-align:center}
.toast.show{opacity:1}
dialog{border:1px solid var(--line);border-radius:14px;background:var(--surface);color:var(--fg);width:min(92vw,560px);padding:16px}
dialog::backdrop{background:rgba(0,0,0,.45)}
dialog h2{font-family:var(--f-display);font-size:19px;margin:0 0 8px}
dialog textarea{min-height:40vh;font-size:13.5px}
dialog .row{display:flex;gap:8px;margin-top:10px}
dialog .row .btn{flex:1}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<header class="intro wrap">
  <h1>깽이와 테리의 시음회 노트</h1>
  <p class="lede">‘≈’ 표시는 정확히 같은 퀴베를 찾지 못해 가장 가까운 항목으로 대신한 경우이고, ‘—’는 Vivino에 등록되지 않았거나 평가가 부족한 경우입니다.</p>
  <div class="progress"><div class="bar"><i id="bar"></i></div><span id="prog">0 / 132 시음</span></div>
</header>

<div class="controls">
  <div class="wrap">
    <div class="search">
      <input type="search" id="q" placeholder="와인, 산지, 품종, 메모 검색" aria-label="검색" autocomplete="off">
      <select id="sort" aria-label="정렬">
        <option value="list">출품순</option>
        <option value="rating">Vivino순</option>
        <option value="mine">내 별점순</option>
        <option value="price">가격순</option>
      </select>
    </div>
    <div class="scroller" id="status"></div>
    <div class="scroller" id="types"></div>
    <div class="scroller" id="importers"></div>
    <div class="count" id="count"></div>
  </div>
</div>

<main class="wrap" id="out"></main>

<div class="dock"><div class="wrap">
  <button class="btn" id="top-btn" type="button">맨 위로</button>
  <button class="btn primary" id="share-btn" type="button">내 노트 공유하기</button>
</div></div>

<dialog id="dlg">
  <h2>내 시음 노트</h2>
  <p class="lede" style="margin:0 0 8px">복사해서 카톡 등에 붙여넣으면 같이 볼 수 있어요.</p>
  <textarea id="dlg-text" readonly aria-label="내 시음 노트 텍스트"></textarea>
  <div class="row"><button class="btn" type="button" id="dlg-close">닫기</button><button class="btn primary" type="button" id="dlg-copy">복사</button></div>
</dialog>
<div class="toast" id="toast" role="status"></div>

<script>
const TYPES={R:"레드",W:"화이트",S:"스파클링",P:"로제",D:"디저트·주정강화",O:"오렌지·내추럴"};
// [수입사, 출품명, 유형, Vivino명, 산지·품종, 평점, 평가수, VivinoID, 노트, 대표후기, [가격 하한,상한](만원)]
const W=[
["금양","폴 자불레 애네 크로즈 에르미타쥬 레 잘레 루즈","R","Paul Jaboulet Aîné Crozes-Hermitage Les Jalets","프랑스 북부 론 · 시라",3.8,15821,1179350,"블랙베리·자두·블랙체리에 후추, 가죽, 은은한 스모크. 중간 이상의 바디에 탄닌은 부드럽고 산도는 중간.","“블랙베리와 자두, 후추와 시나몬 힌트. 드라이하고 부드러워 추운 날 영화 보며 마시기 좋다.”",[4,5]],
["금양","폴 자불레 애네 크로즈 에르미타쥬 레 잘레 블랑","W","Paul Jaboulet Aîné Crozes-Hermitage Les Jalets Blanc","프랑스 북부 론 · 마르산·루산",3.7,1906,1941516,"꿀, 살구·복숭아, 배, 은은한 오크와 바닐라. 산도는 낮은 편이라 질감이 둥글다.","“꿀·사과·마지판 향. 게임 요리 전채와도 밀리지 않는 존재감 있는 화이트.”",[4,5]],
["금양","트라피체 비져너리 싱글빈야드 오렐라나","R","≈ Trapiche Terroir Series Finca Orellana Malbec","아르헨티나 우코 밸리 · 말벡",4.2,2321,6051470,"자두·블랙베리에 오크, 바닐라, 초콜릿. 풀바디에 농축감이 크고 탄닌은 실키하다.","“블랙체리·블랙커런트·자두가 가득한 진한 향에 삼나무가 잘 어우러진다. 잔 와인으로 마시고 놀랐다.”",[7,9]],
["금양","카사 로호 마초맨 그란 비노 IX","R","≈ Casa Rojo MMM Macho Man","스페인 후미야 · 모나스트렐",3.8,17959,2022621,"잘 익은 자두·블랙베리, 오크·초콜릿, 감초. 탄닌이 꽤 단단한 편.","“후미야 특유의 잘 익은 과실감. 젊지만 균형 잡혔고 라벨도 재미있다.”",[3,4]],
["금양","크래기 레인지 김블렛 그래블 빈야드 샤도네이","W","Craggy Range Chardonnay Gimblett Gravels Vineyard","뉴질랜드 혹스베이 · 샤르도네",3.8,739,87013,"버터·오크·바닐라에 복숭아·핵과, 레몬, 플린트 미네랄.","“옅은 볏짚색에 과일과 오크·바닐라 향. 젊은데도 매끄럽고 섬세하며 숙성 잠재력도 있다.”",[5,6]],
["금양","소노마 커터 소노마 코스트 샤르도네","W","Sonoma-Cutrer Sonoma Coast Chardonnay","미국 소노마 코스트 · 샤르도네",3.9,11613,1546803,"버터·바닐라 오크에 배·사과·복숭아, 레몬. 바디감이 있고 질감이 크리미하다.","“크림과 오크가 과하지 않고 사과와 시트러스가 상쾌하다. 데일리로 훌륭한 가성비.”",[5,6]],
["금양","도멘 롱 드파키 샤블리","W","Domaine Long-Depaquit Chablis","프랑스 샤블리 · 샤르도네",3.9,6024,1133162,"청사과·배, 레몬·라임, 돌·미네랄. 산도가 높고 깔끔한 정통 샤블리.","“샤블리 AOC의 좋은 예. 레몬, 노란 사과, 라임이 중간 강도로 뚜렷하다.”",[4,5]],
["금양","샤또 라 네르뜨 샤또네프 뒤 빠쁘 루즈","R","Château La Nerthe Châteauneuf-du-Pape","프랑스 남부 론 · 그르나슈 블렌드",4.2,28820,84287,"블랙베리·자두·체리에 가죽, 담배, 허브, 스파이스. 풀바디에 잘 익은 탄닌.","“짙은 루비색. 블랙베리, 자두, 가죽, 담배, 허브가 풍부하고 풀바디에 산도도 살아 있다.”",[10,13]],
["나라셀라","벨 꼴레 바롤로 10주년","R","≈ BelColle Barolo Riserva 10 Anni","이탈리아 바롤로 · 네비올로",4.1,2660,8558817,"체리·라즈베리에 가죽, 타르, 담배, 감초. 산도와 탄닌이 모두 높은 정통 바롤로.","“90분 브리딩 후 훌륭해졌다. 체리, 후추, 담배, 감초, 자두가 겹겹이.”",[10,13]],
["나라셀라","골드트라움 NV","S","≈ Dr. Zenzen Goldtraum 22 Karat Gold","독일 · 금박 스파클링",3.4,90,2026802,"배·사과, 레몬. 가볍고 단순한 스타일로 금박이 들어간 이벤트용 스파클링.","“심플한 프로세코 같은 맛. 맛보다는 보는 재미가 있는 와인.”",[2,3]],
["나라셀라","다우 레이트 바틀드 빈티지 포트","D","Dow's Late Bottled Vintage Port","포르투갈 도루 · 포트",4.0,10091,1361814,"초콜릿·캐러멜, 자두·블랙베리, 건포도·무화과. 달고 진하며 부드럽다.","“가격 대비 훌륭한 LBV. 대추야자와 무화과가 먼저 튀어나온다.”",[4,5]],
["나라셀라","덕혼 캔버스백 카버네 소비뇽","R","Canvasback Cabernet Sauvignon (Red Mountain)","미국 워싱턴 레드 마운틴 · 카베르네 소비뇽",4.1,11834,2674044,"블랙베리·다크체리·자두, 오크·바닐라·초콜릿, 가죽. 산도와 탄닌이 단단하다.","“덕혼 와인 중 최고. 다크체리, 블랙베리, 바닐라에 가죽 한 방울, 바닐라 여운이 길다.”",[9,12]],
["나라셀라","조쉬 셀라 리저브 노스 코스트 카버네 소비뇽","R","Josh Cellars Reserve North Coast Cabernet Sauvignon","미국 캘리포니아 노스 코스트 · 카베르네 소비뇽",4.0,3690,6400581,"자두·블랙베리, 오크·바닐라, 은은한 담배. 바디감 있고 질감이 벨벳 같다.","“가격 대비 대단하다. 자두, 또 자두. 너무 달지도 무겁지도 않고 벨벳 같다.”",[4,5]],

const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const won=p=>p?`${p[0]}~${p[1]}만원`:"";
const STORE="wine-tasting-2026-10";
let my={};
try{my=JSON.parse(localStorage.getItem(STORE)||"{}")||{}}catch(e){my={}}
const save=()=>{try{localStorage.setItem(STORE,JSON.stringify(my))}catch(e){}};
const get=k=>my[k]||(my[k]={});

let prefs={status:"all",type:"all",imp:"all",sort:"list"};
try{Object.assign(prefs,JSON.parse(sessionStorage.getItem(STORE+"-ui")||"{}"))}catch(e){}
const savePrefs=()=>{try{sessionStorage.setItem(STORE+"-ui",JSON.stringify(prefs))}catch(e){}};
let q="";

const imps=[...new Set(W.map(w=>w[0]))];
function chips(el,items,key){
  const paint=()=>el.querySelectorAll(".chip").forEach(c=>c.setAttribute("aria-pressed",c.dataset.v===prefs[key]));
  el.innerHTML=items.map(([v,l])=>`<button type="button" class="chip" data-v="${esc(v)}">${esc(l)}</button>`).join("");
  paint();
  el.onclick=e=>{const b=e.target.closest(".chip");if(!b)return;prefs[key]=b.dataset.v;paint();savePrefs();render()};
}
chips($("#status"),[["all","전체"],["wish","♥ 찜"],["todo","아직 안 마심"],["done","마신 것"],["sat","토요일만"],["sun","일요일만"]],"status");
chips($("#types"),[["all","모든 유형"],...Object.entries(TYPES)],"type");
chips($("#importers"),[["all","모든 수입사"],...imps.map(i=>[i,i])],"imp");
$("#sort").value=prefs.sort;

function card(w){
  const m=my[w.key]||{};
  const [imp,,t,vname,reg,r,c,id,note,rev,price]=w;
  const approx=vname.startsWith("≈")?"≈":"";
  const viv=r?`<b>${approx}${r.toFixed(1)}</b><small>Vivino ${c.toLocaleString()}</small>`:`<b>—</b><small>Vivino</small>`;
  const tags=w.tags.map(x=>`<span class="tag day">${esc(x)}</span>`).join("");
  const hasInfo=id||(note&&!note.startsWith("Vivino"));
  const info=hasInfo?`<details><summary>노트 · 후기 보기</summary><div class="info">
      ${note&&!note.startsWith("Vivino")?`<p><span class="lbl">테이스팅 노트</span>${esc(note)}</p>`:""}
      ${rev&&rev!=="—"?`<p class="rev"><span class="lbl">Vivino 대표 후기</span>${esc(rev)}</p>`:""}
      ${id?`<a href="https://www.vivino.com/w/${id}" target="_blank" rel="noopener">Vivino에서 보기 · ${esc(vname.replace(/^≈ /,""))}</a>`:""}
    </div></details>`:"";
  const stars=[1,2,3,4,5].map(n=>`<button type="button" data-act="star" data-n="${n}" class="${(m.stars||0)>=n?"on":""}" aria-label="내 별점 ${n}점">★</button>`).join("");
  return `<article class="card${m.done?" done":""}" data-i="${w.idx}">
    <div class="top"><div class="name">${esc(w.name)}</div><div class="viv">${viv}</div></div>
    <div class="meta"><span class="tag t-${t}">${TYPES[t]}</span>${tags}${reg&&reg!=="—"?`<span>${esc(reg)}</span>`:""}${price?`<span class="price">${won(price)}</span>`:""}</div>
    ${info}
    <div class="mine">
      <div class="mine-row">
        <button type="button" class="btn check" data-act="done" aria-pressed="${!!m.done}">${m.done?"✓ 마셨어요":"마셨어요"}</button>
        <button type="button" class="btn wish" data-act="wish" aria-pressed="${!!m.wish}" aria-label="찜">${m.wish?"♥":"♡"}</button>
        <div class="stars" role="group" aria-label="내 별점">${stars}</div>
      </div>
      <textarea data-act="memo" rows="1" placeholder="내 메모 (향, 맛, 페어링…)" aria-label="${esc(w.name)} 메모">${esc(m.memo||"")}</textarea>
    </div>
  </article>`;
}

function matches(w){
  const m=my[w.key]||{};
  const s=prefs.status;
  if(s==="todo"&&m.done)return false;
  if(s==="done"&&!m.done)return false;
  if(s==="wish"&&!m.wish)return false;
  if(s==="sat"&&!w.tags.includes("토요일만"))return false;
  if(s==="sun"&&!w.tags.includes("일요일만"))return false;
  if(prefs.type!=="all"&&w[2]!==prefs.type)return false;
  if(prefs.imp!=="all"&&w[0]!==prefs.imp)return false;
  if(q){const hay=w.hay+" "+norm(m.memo||"");if(!q.split(/\s+/).every(t=>hay.includes(t)))return false}
  return true;
}
function render(){
  const rows=W.filter(matches);
  $("#count").textContent=`${rows.length}종 표시 중`;
  const out=$("#out");
  if(!rows.length){out.innerHTML='<p class="empty">조건에 맞는 와인이 없어요. 검색어나 필터를 바꿔 보세요.</p>';return}
  if(prefs.sort==="list"){
    out.innerHTML=imps.map(i=>{const g=rows.filter(w=>w[0]===i);return g.length?`<h2 class="group-h">${esc(i)}<small>${g.length}종</small></h2><div class="list">${g.map(card).join("")}</div>`:""}).join("");
  }else{
    const by={rating:(a,b)=>(b[5]||0)-(a[5]||0),
      mine:(a,b)=>((my[b.key]||{}).stars||0)-((my[a.key]||{}).stars||0)||(b[5]||0)-(a[5]||0),
      price:(a,b)=>(a[10]?a[10][0]:999)-(b[10]?b[10][0]:999)}[prefs.sort];
    out.innerHTML=`<div class="list" style="margin-top:14px">${[...rows].sort(by).map(card).join("")}</div>`;
  }
  out.querySelectorAll("textarea").forEach(grow);
  progress();
}
function progress(){
  const n=W.filter(w=>(my[w.key]||{}).done).length;
  $("#prog").textContent=`${n} / ${W.length} 시음`;
  $("#bar").style.width=(n/W.length*100)+"%";
  const wish=W.filter(w=>(my[w.key]||{}).wish).length;
  $('#status .chip[data-v="done"]').textContent=`마신 것 ${n}`;
  $('#status .chip[data-v="wish"]').textContent=`♥ 찜 ${wish}`;
}
function grow(t){t.style.height="auto";t.style.height=t.scrollHeight+2+"px"}

// 카드 안 조작: 전체를 다시 그리지 않고 해당 카드만 갱신해 스크롤 위치 유지
$("#out").addEventListener("click",e=>{
  const b=e.target.closest("[data-act]");if(!b||b.tagName==="TEXTAREA")return;
  const cardEl=b.closest(".card"),w=W[+cardEl.dataset.i],m=get(w.key);
  if(b.dataset.act==="done")m.done=!m.done;
  if(b.dataset.act==="wish")m.wish=!m.wish;
  if(b.dataset.act==="star"){const n=+b.dataset.n;m.stars=m.stars===n?0:n;if(n&&!m.done&&m.stars)m.done=true}
  save();
  const fresh=document.createElement("div");fresh.innerHTML=card(w);
  const nc=fresh.firstElementChild;cardEl.replaceWith(nc);nc.querySelectorAll("textarea").forEach(grow);
  progress();
});
$("#out").addEventListener("input",e=>{
  const t=e.target;if(t.dataset.act!=="memo")return;
  const w=W[+t.closest(".card").dataset.i];get(w.key).memo=t.value;save();grow(t);
});

let timer;$("#q").addEventListener("input",e=>{clearTimeout(timer);timer=setTimeout(()=>{q=norm(e.target.value).trim();render()},120)});
$("#sort").onchange=e=>{prefs.sort=e.target.value;savePrefs();render()};
$("#top-btn").onclick=()=>window.scrollTo({top:0,behavior:"smooth"});

function toast(s){const t=$("#toast");t.textContent=s;t.classList.add("show");setTimeout(()=>t.classList.remove("show"),1800)}
function exportText(){
  const done=W.filter(w=>{const m=my[w.key]||{};return m.done||m.stars||m.memo});
  if(!done.length)return "";
  const lines=["🍷 깽이와 테리의 시음회 노트",""];
  imps.forEach(i=>{
    const g=done.filter(w=>w[0]===i);if(!g.length)return;
    lines.push(`[${i}]`);
    g.forEach(w=>{const m=my[w.key];lines.push(`· ${w.name}${m.stars?" "+"★".repeat(m.stars)+"☆".repeat(5-m.stars):""}${w[5]?` (Vivino ${w[5].toFixed(1)})`:""}`);if(m.memo)lines.push(`  ${m.memo.replace(/\n/g," ")}`)});
    lines.push("");
  });
  return lines.join("\n").trim();
}
$("#share-btn").onclick=async()=>{
  const txt=exportText();
  if(!txt){toast("아직 기록한 와인이 없어요");return}
  if(navigator.share){try{await navigator.share({title:"깽이와 테리의 시음회 노트",text:txt});return}catch(e){if(e.name==="AbortError")return}}
  $("#dlg-text").value=txt;$("#dlg").showModal();
};
$("#dlg-close").onclick=()=>$("#dlg").close();
$("#dlg-copy").onclick=async()=>{
  const t=$("#dlg-text");
  try{await navigator.clipboard.writeText(t.value);toast("복사했어요")}
  catch(e){t.select();toast("선택했어요. 길게 눌러 복사하세요")}
};

render();
</script>
</body>
</html>
